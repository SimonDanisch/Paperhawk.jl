[project]
name = "paperhawk-models"
version = "0.1.0"
description = "Dev-only: evaluate document models and export them for JuliaVision (CPU torch)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=5.17",
    "safetensors",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "huggingface-hub",
    "pyclipper",
    "shapely",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
